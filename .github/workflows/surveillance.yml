name: Disponibilite ARO et ARO-CEP
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/surveillance.yml'
permissions:
  contents: write
concurrency:
  group: surveillance-modeles
  cancel-in-progress: false
jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Identifier le declenchement
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Evenement GitHub : $EVENT_NAME"
          date -u '+Depart reel : %Y-%m-%d %H:%M:%S UTC'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Sonder les RR1h
        env:
          METEOFRANCE_API_KEY: ${{ secrets.METEOFRANCE_API_KEY }}
        run: python surveiller_modeles.py
      - name: Conserver les observations dans le depot
        if: always()
        run: |
          if [ ! -d data ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Mesures de disponibilite des modeles'
          git push
      - name: Fournir le rapport telechargeable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disponibilite-modeles
          path: data/
          retention-days: 30
